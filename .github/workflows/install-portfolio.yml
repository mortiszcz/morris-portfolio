name: Install Morris Portfolio

on:
  push:
    paths:
      - 'morris-portfolio-production.zip'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract production portfolio
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .portfolio-import
          mkdir -p .portfolio-import

          unzip -q morris-portfolio-production.zip -d .portfolio-import

          if [ -d ".portfolio-import/morris-portfolio-production" ]; then
            SOURCE=".portfolio-import/morris-portfolio-production"
          else
            SOURCE=".portfolio-import"
          fi

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$SOURCE/" ./

          rm -rf .portfolio-import
          rm -f morris-portfolio-production.zip

      - name: Commit installed portfolio
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Install Morris production portfolio"
          git push
